[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "family-assistant"
version = "0.1.0"
description = "Household assistant: Telegram + Claude API + Yuvomi + Gmail"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4,<3",
    "httpx>=0.28,<1",
    "python-telegram-bot[job-queue]>=22.8,<23",
    "google-auth>=2.62,<3",
    "google-auth-oauthlib>=1.5,<2",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
